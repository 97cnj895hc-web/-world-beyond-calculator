<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#111426" />
<title>世界之外｜升卡材料計算器</title>
<style>
:root{
  --bg:#090b15;
  --panel:#111426;
  --panel2:#171a31;
  --line:rgba(255,255,255,.09);
  --text:#f7f7fb;
  --muted:#aeb3c7;
  --accent:#b9c7ff;
  --accent2:#d8deff;
  --good:#baf0d1;
  --shadow:0 18px 50px rgba(0,0,0,.35);
  --radius:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:
    radial-gradient(circle at 15% 0%,rgba(90,109,193,.22),transparent 32%),
    radial-gradient(circle at 90% 20%,rgba(105,82,163,.14),transparent 30%),
    linear-gradient(180deg,#090b15 0%,#0c0f1c 55%,#090b15 100%);
  color:var(--text);
}
button,select,input{font:inherit}
button{cursor:pointer}
.wrap{width:min(980px,calc(100% - 28px));margin:0 auto;padding:34px 0 70px}
.hero{padding:20px 2px 26px}
.eyebrow{color:var(--accent);font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:9px}
h1{font-size:clamp(28px,6vw,46px);line-height:1.08;margin:0 0 12px;font-weight:750;letter-spacing:.03em}
.subtitle{margin:0;color:var(--muted);font-size:15px;line-height:1.7;max-width:760px}
.card{
  background:linear-gradient(180deg,rgba(23,26,49,.94),rgba(17,20,38,.96));
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  border-radius:var(--radius);
  padding:20px;
  margin:16px 0;
  backdrop-filter:blur(16px);
}
.card h2{font-size:21px;margin:0 0 15px}
.card h3{font-size:15px;margin:18px 0 10px;color:var(--accent2)}
.segmented{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  background:rgba(255,255,255,.045);
  padding:6px;
  border-radius:16px;
}
.segmented button{
  border:0;
  color:var(--muted);
  background:transparent;
  padding:12px;
  border-radius:12px;
  transition:.18s ease;
}
.segmented button.active{
  color:#111426;
  background:var(--accent2);
  font-weight:700;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;color:var(--muted);font-size:13px;margin:0 0 7px}
select{
  width:100%;
  appearance:none;
  border:1px solid var(--line);
  background:#0d1020;
  color:var(--text);
  padding:13px 42px 13px 13px;
  border-radius:14px;
  outline:none;
  background-image:linear-gradient(45deg,transparent 50%,#aeb3c7 50%),linear-gradient(135deg,#aeb3c7 50%,transparent 50%);
  background-position:calc(100% - 18px) 52%,calc(100% - 12px) 52%;
  background-size:6px 6px,6px 6px;
  background-repeat:no-repeat;
}
.checkrow{
  display:flex;align-items:center;gap:9px;
  color:var(--muted);font-size:14px;margin-top:12px;
}
.checkrow input{width:18px;height:18px;accent-color:#cbd4ff}
.result{
  margin-top:16px;
  border-top:1px solid var(--line);
  padding-top:16px;
}
.bigline{
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:12px;padding:13px 0 15px;
}
.bigline .label{color:var(--muted);font-size:13px}
.bigline .value{font-size:30px;font-weight:760;letter-spacing:.02em}
.pills{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.pill{
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.055);
  border-radius:15px;padding:12px 13px;
}
.pill .name{font-size:12px;color:var(--muted);margin-bottom:5px}
.pill .num{font-size:19px;font-weight:700}
.pill.zero{opacity:.42}
.recommend{
  border:1px solid rgba(185,199,255,.23);
  background:linear-gradient(135deg,rgba(185,199,255,.09),rgba(255,255,255,.025));
  border-radius:16px;padding:14px;margin-top:12px;
}
.recommend .title{font-size:13px;color:var(--accent2);margin-bottom:8px}
.combo{font-size:17px;font-weight:680;line-height:1.6}
.detail{color:var(--muted);font-size:12px;line-height:1.65;margin-top:6px}
.breakdown{
  width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;
}
.breakdown th,.breakdown td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
.breakdown th{color:var(--muted);font-weight:500}
.breakdown td:last-child,.breakdown th:last-child{text-align:right}
.notice{
  color:var(--muted);font-size:12px;line-height:1.7;
  padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.035);
  margin-top:12px;
}
.multi-list{display:grid;gap:12px;margin-top:14px}
.multi-item{
  border:1px solid var(--line);
  background:rgba(255,255,255,.028);
  border-radius:17px;
  padding:14px;
}
.multi-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:11px;
}
.multi-title{font-weight:720;font-size:15px}
.multi-sub{color:var(--muted);font-size:12px}
.total-badge{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid rgba(185,199,255,.2);
  background:rgba(185,199,255,.08);
  color:var(--accent2);
  border-radius:999px;padding:6px 9px;font-size:11px;
}
.error{color:#ffd1d1;margin-top:12px;font-size:13px}
.footer{color:#777f9d;font-size:12px;line-height:1.7;text-align:center;padding-top:16px}
@media (min-width:760px){
  .pills{grid-template-columns:repeat(3,1fr)}
  .card{padding:24px}
}
@media (max-width:560px){
  .grid{grid-template-columns:1fr}
  .bigline .value{font-size:26px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">threads:@phmo.xx</div>
    <h1>側影材料計算器</h1>
    <p class="subtitle">計算等級提升與單一互動（技能）所需材料。全站不進行體力換算；經驗會自動換算為私語、同游與燭下約。</p>
  </header>

  <section class="card">
    <h2>卡片類型</h2>
    <div class="segmented" id="cardType">
      <button type="button" data-type="world" class="active">世界卡</button>
      <button type="button" data-type="month">月卡</button>
    </div>
  </section>

  <section class="card">
    <h2>1．等級提升</h2>

    <div class="field">
      <label for="cardCount">計算卡片數量（最多 4 張）</label>
      <select id="cardCount">
        <option value="1">1 張</option>
        <option value="2">2 張</option>
        <option value="3">3 張</option>
        <option value="4">4 張</option>
      </select>
    </div>

    <div id="levelCards" class="multi-list"></div>

    <div id="levelResult" class="result"></div>
    <div class="notice">每張卡都可以分別設定目前等級、目標等級與是否計入重逢。總計會自動合併最多 4 張卡的經驗與材料。圖片只提供各大等級區間的總經驗，因此使用 1、20、40、50、60、70、80 等節點計算。</div>
  </section>

  <section class="card">
    <h2>2．互動（技能）</h2>

    <div class="field">
      <label for="interactionCount">計算互動數量</label>
      <select id="interactionCount"></select>
    </div>

    <div id="interactionList" class="multi-list"></div>

    <div id="skillResult" class="result"></div>
    <div class="notice">世界卡最多可同時計算 4 個互動；月卡最多 3 個。每個互動都能分別設定目前與目標技能等級。</div>
  </section>

  <footer class="footer">
    資料依你提供的養成材料統計圖整理。<br>
    經驗道具：私語 +350｜同游 +900｜燭下約 +2,500
  </footer>
</div>

<script>
const EXP_ITEMS = {
  "私語": 350,
  "同游": 900,
  "燭下約": 2500
};

const DATA = {
  world: {
    name: "世界卡",
    maxLevel: 80,
    levelSegments: [
      {from:1,to:20,exp:17686},
      {from:20,to:40,exp:86742},
      {from:40,to:50,exp:86862},
      {from:50,to:60,exp:128116},
      {from:60,to:70,exp:179385},
      {from:70,to:80,exp:241779}
    ],
    ascensions: {
      20: {"命運輪":2,"晶幣":46000},
      40: {"命運輪":4,"晶幣":69000},
      50: {"命運輪":2,"晶幣":92000,"相會物品":6},
      60: {"三世鏡":10,"晶幣":115000,"相會物品":6},
      70: {"三世鏡":12,"晶幣":138000,"重逢物品":18}
    },
    reunion: {"晶幣":115000,"重逢物品":24},
    skills: [
      {from:1,to:2,mat:{"懷錶":1,"晶幣":13800}},
      {from:2,to:3,mat:{"懷錶":2,"晶幣":18400}},
      {from:3,to:4,mat:{"懷錶":3,"晶幣":27600}},
      {from:4,to:5,mat:{"懷錶":2,"晶幣":41400,"相會物品":2}},
      {from:5,to:6,mat:{"懷錶":2,"晶幣":82800,"相會物品":3}},
      {from:6,to:7,mat:{"星圖":3,"晶幣":138000,"相會物品":3}},
      {from:7,to:8,mat:{"星圖":4,"晶幣":322000,"互動物品":4}},
      {from:8,to:9,mat:{"星圖":6,"晶幣":552000,"互動物品":6}},
      {from:9,to:10,mat:{"星圖":8,"晶幣":920000,"互動物品":8,"紅線":1}}
    ]
  },
  month: {
    name: "月卡",
    maxLevel: 70,
    levelSegments: [
      {from:1,to:20,exp:17686},
      {from:20,to:40,exp:86742},
      {from:40,to:50,exp:86862},
      {from:50,to:60,exp:128116},
      {from:60,to:70,exp:179385}
    ],
    ascensions: {
      20: {"命運輪":2,"晶幣":34500},
      40: {"命運輪":4,"晶幣":51750},
      50: {"命運輪":2,"晶幣":69000,"相會物品":6},
      60: {"三世鏡":10,"晶幣":86250,"相會物品":6}
    },
    reunion: {"晶幣":86250,"重逢物品":8},
    skills: [
      {from:1,to:2,mat:{"懷錶":1,"晶幣":10350}},
      {from:2,to:3,mat:{"懷錶":2,"晶幣":13800}},
      {from:3,to:4,mat:{"懷錶":3,"晶幣":20700}},
      {from:4,to:5,mat:{"懷錶":2,"晶幣":31050,"相會物品":2}},
      {from:5,to:6,mat:{"懷錶":2,"晶幣":62100,"相會物品":3}},
      {from:6,to:7,mat:{"星圖":3,"晶幣":103500,"相會物品":3}},
      {from:7,to:8,mat:{"星圖":4,"晶幣":241500,"互動物品":4}},
      {from:8,to:9,mat:{"星圖":6,"晶幣":414000,"互動物品":6}},
      {from:9,to:10,mat:{"星圖":8,"晶幣":690000,"互動物品":8,"紅線":1}}
    ]
  }
};

let currentType = "world";
const $ = s => document.querySelector(s);
const fmt = n => Number(n || 0).toLocaleString("zh-TW");

function addMat(target, mat){
  Object.entries(mat || {}).forEach(([k,v]) => target[k] = (target[k] || 0) + v);
}
function renderPills(obj, order){
  return `<div class="pills">${order.map(name => `
    <div class="pill ${(obj[name]||0)===0 ? "zero":""}">
      <div class="name">${name}</div>
      <div class="num">${fmt(obj[name]||0)}</div>
    </div>`).join("")}</div>`;
}

/* 先追求最少溢出經驗，再追求最少道具數量 */
function bestExpCombo(required){
  if(required <= 0) return {candle:0,travel:0,whisper:0,total:0,overflow:0,count:0};
  let best = null;
  const maxCandle = Math.ceil(required / 2500) + 2;
  for(let candle=0;candle<=maxCandle;candle++){
    const leftAfterCandle = Math.max(0, required - candle*2500);
    const baseTravel = Math.floor(leftAfterCandle/900);
    for(let travel=Math.max(0,baseTravel-2);travel<=baseTravel+4;travel++){
      const left = required - candle*2500 - travel*900;
      const whisper = Math.max(0, Math.ceil(left/350));
      const total = candle*2500 + travel*900 + whisper*350;
      if(total < required) continue;
      const cand = {
        candle,travel,whisper,total,
        overflow:total-required,
        count:candle+travel+whisper
      };
      if(!best ||
         cand.overflow < best.overflow ||
         (cand.overflow === best.overflow && cand.count < best.count) ||
         (cand.overflow === best.overflow && cand.count === best.count && cand.candle > best.candle)){
        best = cand;
      }
    }
  }
  return best;
}


/* 綜藝密室—大堂比例推薦：燭下約 ×2、同游 ×3、私語 ×2 */
function ratioExpCombo(required){
  const groupExp = 2*2500 + 3*900 + 2*350;
  if(required <= 0) return {groups:0,candle:0,travel:0,whisper:0,total:0,overflow:0,count:0};
  const groups = Math.ceil(required / groupExp);
  const candle = groups * 2, travel = groups * 3, whisper = groups * 2;
  const total = groups * groupExp;
  return {groups,candle,travel,whisper,total,overflow:total-required,count:candle+travel+whisper};
}

function levelNodesFor(type){
  const d = DATA[type];
  return [1, ...d.levelSegments.map(x=>x.to)];
}

function levelOptions(type, selected){
  const nodes = levelNodesFor(type);
  return nodes.map(n=>`<option value="${n}" ${n===selected ? "selected":""}>${n} 級</option>`).join("");
}

function skillOptions(selected){
  return Array.from({length:10},(_,i)=>i+1)
    .map(n=>`<option value="${n}" ${n===selected ? "selected":""}>${n} 級</option>`).join("");
}

function renderLevelCards(){
  const count = Number($("#cardCount").value || 1);
  const box = $("#levelCards");
  const d = DATA[currentType];

  const previous = [...box.querySelectorAll(".multi-item")].map(item=>({
    from:Number(item.querySelector(".level-from")?.value || 1),
    to:Number(item.querySelector(".level-to")?.value || d.maxLevel),
    reunion:!!item.querySelector(".level-reunion")?.checked
  }));

  box.innerHTML = Array.from({length:count},(_,i)=>{
    const p = previous[i] || {from:1,to:d.maxLevel,reunion:false};
    const nodes = levelNodesFor(currentType);
    const from = nodes.includes(p.from) ? p.from : 1;
    const to = nodes.includes(p.to) ? p.to : d.maxLevel;
    return `
      <div class="multi-item" data-index="${i}">
        <div class="multi-head">
          <div>
            <div class="multi-title">卡片 ${i+1}</div>
            <div class="multi-sub">${d.name}</div>
          </div>
          <span class="total-badge">第 ${i+1} 張</span>
        </div>
        <div class="grid">
          <div class="field">
            <label>目前等級</label>
            <select class="level-from">${levelOptions(currentType,from)}</select>
          </div>
          <div class="field">
            <label>目標等級</label>
            <select class="level-to">${levelOptions(currentType,to)}</select>
          </div>
        </div>
        <label class="checkrow">
          <input type="checkbox" class="level-reunion" ${p.reunion ? "checked":""}>
          這張卡另外計入「重逢」材料
        </label>
      </div>`;
  }).join("");

  box.querySelectorAll("select,input").forEach(el=>el.addEventListener("change",calcLevels));
  calcLevels();
}

function setInteractionCountOptions(){
  const sel = $("#interactionCount");
  const max = currentType === "month" ? 3 : 4;
  const old = Math.min(Number(sel.value || 1), max);
  sel.innerHTML = Array.from({length:max},(_,i)=>i+1)
    .map(n=>`<option value="${n}">${n} 個</option>`).join("");
  sel.value = old;
}

function renderInteractions(){
  setInteractionCountOptions();
  const count = Number($("#interactionCount").value || 1);
  const box = $("#interactionList");

  const previous = [...box.querySelectorAll(".multi-item")].map(item=>({
    from:Number(item.querySelector(".skill-from")?.value || 1),
    to:Number(item.querySelector(".skill-to")?.value || 10)
  }));

  box.innerHTML = Array.from({length:count},(_,i)=>{
    const p = previous[i] || {from:1,to:10};
    return `
      <div class="multi-item" data-index="${i}">
        <div class="multi-head">
          <div>
            <div class="multi-title">互動 ${i+1}</div>
            <div class="multi-sub">技能等級提升</div>
          </div>
          <span class="total-badge">第 ${i+1} 個</span>
        </div>
        <div class="grid">
          <div class="field">
            <label>目前互動等級</label>
            <select class="skill-from">${skillOptions(p.from)}</select>
          </div>
          <div class="field">
            <label>目標互動等級</label>
            <select class="skill-to">${skillOptions(p.to)}</select>
          </div>
        </div>
      </div>`;
  }).join("");

  box.querySelectorAll("select").forEach(el=>el.addEventListener("change",calcSkills));
  calcSkills();
}

function calcOneLevelCard(from,to,reunion){
  const d = DATA[currentType];
  let exp = 0;
  const mats = {"晶幣":0,"命運輪":0,"三世鏡":0,"相會物品":0,"重逢物品":0};
  const rows = [];

  if(to <= from) return {valid:false,exp,mats,rows};

  for(const seg of d.levelSegments){
    if(seg.from >= from && seg.to <= to){
      exp += seg.exp;
      rows.push(`${seg.from}→${seg.to}`);
      if(seg.to < to && d.ascensions[seg.to]) addMat(mats,d.ascensions[seg.to]);
    }
  }
  if(reunion) addMat(mats,d.reunion);
  return {valid:true,exp,mats,rows};
}

function calcLevels(){
  const items = [...document.querySelectorAll("#levelCards .multi-item")];
  const totalMats = {"晶幣":0,"命運輪":0,"三世鏡":0,"相會物品":0,"重逢物品":0};
  let totalExp = 0;
  let invalid = false;
  const details = [];

  items.forEach((item,i)=>{
    const from = Number(item.querySelector(".level-from").value);
    const to = Number(item.querySelector(".level-to").value);
    const reunion = item.querySelector(".level-reunion").checked;
    const r = calcOneLevelCard(from,to,reunion);
    if(!r.valid) invalid = true;
    totalExp += r.exp;
    addMat(totalMats,r.mats);
    details.push(`卡片 ${i+1}：${from}→${to}${reunion ? "＋重逢":""}`);
  });

  const box = $("#levelResult");
  if(invalid){
    box.innerHTML = `<div class="error">每張卡的目標等級都需要高於目前等級。</div>`;
    return;
  }

  const combo = bestExpCombo(totalExp);
  const ratio = ratioExpCombo(totalExp);
  const allWhisper = Math.ceil(totalExp/350);
  const allTravel = Math.ceil(totalExp/900);
  const allCandle = Math.ceil(totalExp/2500);

  box.innerHTML = `
    <div class="bigline">
      <div>
        <div class="label">${items.length} 張卡合計所需經驗</div>
        <div class="detail">${details.join("<br>")}</div>
      </div>
      <div class="value">${fmt(totalExp)}</div>
    </div>

    <h3>全部卡片的經驗道具推薦組合</h3>
    <div class="recommend">
      <div class="title">低溢出優先</div>
      <div class="combo">燭下約 × ${fmt(combo.candle)}　同游 × ${fmt(combo.travel)}　私語 × ${fmt(combo.whisper)}</div>
      <div class="detail">可提供 ${fmt(combo.total)} 經驗，超出 ${fmt(combo.overflow)} 經驗，共 ${fmt(combo.count)} 個道具。</div>
    </div>

    <div class="recommend">
      <div class="title">綜藝密室—大堂通關組合｜燭下約 2：同游 3：私語 2</div>
      <div class="combo">燭下約 × ${fmt(ratio.candle)}　同游 × ${fmt(ratio.travel)}　私語 × ${fmt(ratio.whisper)}</div>
      <div class="detail">通關 ${fmt(ratio.groups)} 次，可提供 ${fmt(ratio.total)} 經驗，超出 ${fmt(ratio.overflow)} 經驗，共 ${fmt(ratio.count)} 個道具。</div>
    </div>

    <table class="breakdown">
      <thead><tr><th>若全部只使用單一道具</th><th>所需數量</th></tr></thead>
      <tbody>
        <tr><td>私語（+350）</td><td>${fmt(allWhisper)}</td></tr>
        <tr><td>同游（+900）</td><td>${fmt(allTravel)}</td></tr>
        <tr><td>燭下約（+2,500）</td><td>${fmt(allCandle)}</td></tr>
      </tbody>
    </table>

    <h3>全部卡片材料總計</h3>
    ${renderPills(totalMats,["晶幣","命運輪","三世鏡","相會物品","重逢物品"])}
  `;
}

function calcOneSkill(from,to){
  const d = DATA[currentType];
  const mats = {"晶幣":0,"懷錶":0,"星圖":0,"相會物品":0,"互動物品":0,"紅線":0};
  if(to <= from) return {valid:false,mats,steps:[]};
  const steps = [];
  d.skills.forEach(step=>{
    if(step.from >= from && step.to <= to){
      addMat(mats,step.mat);
      steps.push(`${step.from}→${step.to}`);
    }
  });
  return {valid:true,mats,steps};
}

function calcSkills(){
  const items = [...document.querySelectorAll("#interactionList .multi-item")];
  const totalMats = {"晶幣":0,"懷錶":0,"星圖":0,"相會物品":0,"互動物品":0,"紅線":0};
  let invalid = false;
  const details = [];

  items.forEach((item,i)=>{
    const from = Number(item.querySelector(".skill-from").value);
    const to = Number(item.querySelector(".skill-to").value);
    const r = calcOneSkill(from,to);
    if(!r.valid) invalid = true;
    addMat(totalMats,r.mats);
    details.push(`互動 ${i+1}：${from}→${to}`);
  });

  const box = $("#skillResult");
  if(invalid){
    box.innerHTML = `<div class="error">每個互動的目標技能等級都需要高於目前技能等級。</div>`;
    return;
  }

  box.innerHTML = `
    <div class="bigline">
      <div>
        <div class="label">${items.length} 個互動合計</div>
        <div class="detail">${details.join("<br>")}</div>
      </div>
      <div class="value">${items.length} 個</div>
    </div>
    <h3>全部互動材料總計</h3>
    ${renderPills(totalMats,["晶幣","懷錶","星圖","相會物品","互動物品","紅線"])}
    <div class="notice">互動（技能）不需要經驗道具，也不進行體力換算。</div>
  `;
}

function refresh(){
  renderLevelCards();
  renderInteractions();
}

document.querySelectorAll("#cardType button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentType = btn.dataset.type;
    document.querySelectorAll("#cardType button").forEach(x=>x.classList.toggle("active",x===btn));
    refresh();
  });
});

$("#cardCount").addEventListener("change",renderLevelCards);
$("#interactionCount").addEventListener("change",renderInteractions);

refresh();
refresh();
</script>
</body>
</html>
